name: 仅编译 WebUI 二进制文件
on:
  workflow_dispatch:  # 手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Go 环境
        uses: actions/setup-go@v5
        with:
          go-version: 1.23

      - name: 编译 ARM64 版本（你的设备是 arm64）
        run: |
          CGO_ENABLED=0 \
          GOOS=linux \
          GOARCH=arm64 \
          go build -o airconnect-webui main.go

      - name: 上传二进制文件供下载
        uses: actions/upload-artifact@v4
        with:
          name: airconnect-webui
          path: ./airconnect-webui
