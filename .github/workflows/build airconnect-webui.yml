name: 仅编译 WebUI 二进制文件
on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Go 环境
        uses: actions/setup-go@v5
        with:
          go-version: 1.23
          cache: false

      - name: 编译 ARM64 二进制
        run: |
          CGO_ENABLED=0 \
          GOOS=linux \
          GOARCH=arm64 \
          go build -o airconnect-webui main.go

      - name: 上传文件
        uses: actions/upload-artifact@v4
        with:
          name: airconnect-webui
          path: ./airconnect-webui
